<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- `maximum-scale=1` ferma lo zoom automatico di iOS sui campi con testo
         sotto i 16px e, nell'app installata, anche il pinch (in Safari ci
         pensa `touch-action` in index.css). Non togliere. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020D19" />
    <!-- iOS non legge display:standalone dal manifest: senza questi due
         meta l'app aperta da "Aggiungi a Home" si apre dentro Safari
         invece che a schermo intero. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Courtside" />
    <title>Courtside</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
